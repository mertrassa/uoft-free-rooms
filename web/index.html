<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find empty classrooms at UofT St. George to study in." />
    <meta name="theme-color" content="#eaf0f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e3765" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved Light/Dark choice before first paint (see useTheme in src/hooks.ts).
      try {
        var t = localStorage.getItem("freerooms:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Free Rooms · St. George</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
